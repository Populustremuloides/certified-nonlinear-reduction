[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "certified-stable-reductions"
version = "0.1.0"
description = "Data-driven nonlinear prediction with certified stable reductions"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.2,<3", "matplotlib>=3.7,<4", "mpmath==1.3.0", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
stable-reduction = "stable_reduction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
